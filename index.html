<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nostaplay</title>
    <link rel="shortcut icon" href="img/favicon.ico" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="audio-player">
        <!-- Header -->
        <header class="player-header">
            <h1><i class="fas fa-music"></i> Nostaplay</h1>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Pesquisar..." class="search-input">
                <button id="searchBtn" class="search-btn"><i class="fas fa-search"></i></button>
            </div>
        </header>

        <div class="player-container">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="sidebar-section">
                    <h3><i class="fas fa-folder"></i> Pastas</h3>
                    <div id="folderList" class="folder-list">
                        <div class="loading">Carreagndo pastas...</div>
                    </div>
                </div>
                
                <div class="sidebar-section">
                    <h3><i class="fas fa-list"></i> Playlist</h3>
                    <div id="currentPlaylist" class="playlist">
                        <div class="empty-playlist">Playlist vazia</div>
                    </div>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="main-content">
                <!-- Now Playing -->
                <section class="now-playing">
                    <div class="track-info">
                        <div class="track-artwork">
                            <i class="fas fa-music"></i>
                        </div>
                        <div class="track-details">
                            <h2 id="currentTitle">Nenhuma música selecionada</h2>
                            <p id="currentArtist">Selecione uma música</p>
                        </div>
                    </div>
                    
                    <!-- Audio Controls -->
                    <div class="audio-controls">
                        <div class="control-buttons">
                            <button id="prevBtn" class="control-btn" title="Previous">
                                <i class="fas fa-step-backward"></i>
                            </button>
                            <button id="playPauseBtn" class="control-btn play-pause" title="Play/Pause">
                                <i class="fas fa-play"></i>
                            </button>
                            <button id="nextBtn" class="control-btn" title="Next">
                                <i class="fas fa-step-forward"></i>
                            </button>
                            <button id="shuffleBtn" class="control-btn" title="Shuffle">
                                <i class="fas fa-random"></i>
                            </button>
                            <button id="repeatBtn" class="control-btn" title="Repeat">
                                <i class="fas fa-redo"></i>
                            </button>
                        </div>
                        
                        <!-- Progress Bar -->
                        <div class="progress-container">
                            <span id="currentTime">0:00</span>
                            <div class="progress-bar">
                                <div id="progressFill" class="progress-fill"></div>
                                <input type="range" id="progressSlider" class="progress-slider" min="0" max="100" value="0">
                            </div>
                            <span id="totalTime">0:00</span>
                        </div>
                        
                        <!-- Volume Control -->
                        <div class="hd volume-container">
                            <button id="muteBtn" class="control-btn" title="Mute">
                                <i class="fas fa-volume-up"></i>
                            </button>
                            <div class="volume-bar">
                                <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="50">
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Song List -->
                <section class="song-list-section">
                    <div class="section-header">
                        <h3 id="sectionTitle">Músicas</h3>
                        <div class="view-controls">
                            <button id="refreshBtn" class="btn-secondary" title="Refresh">
                                <i class="fas fa-sync-alt"></i>
                            </button>
                            <button id="addAllBtn" class="btn-primary" title="Add all to playlist">
                                <i class="fas fa-plus"></i> Tocar todas
                            </button>
                        </div>
                    </div>
                    
                    <div id="songList" class="song-list">
                        <div class="loading">Loading songs...</div>
                    </div>
                </section>
            </main>
        </div>

        <!-- Hidden Audio Element -->
        <audio id="audioPlayer" preload="metadata"></audio>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <p>Loading...</p>
    </div>

    <!-- Context Menu -->
    <div id="contextMenu" class="context-menu">
        <div class="context-item" data-action="play">
            <i class="fas fa-play"></i> Play
        </div>
        <div class="context-item" data-action="add-to-playlist">
            <i class="fas fa-plus"></i> Add to Playlist
        </div>
        <div class="context-item" data-action="remove-from-playlist">
            <i class="fas fa-minus"></i> Remove from Playlist
        </div>
    </div>

    <script src="js/audioPlayer.js"></script>
</body>
</html>
